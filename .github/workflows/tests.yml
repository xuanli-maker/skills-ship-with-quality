name: Tests

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - "requirements.dev.txt"
      - "package.json"
      - "jest.config.js"
      - ".github/workflows/tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - "requirements.dev.txt"
      - "package.json"
      - "jest.config.js"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  test-py:
    name: Run unit tests (python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements.dev.txt

      - name: Run unit tests with coverage output
        run: pytest --cov=src --cov-report=xml:coverage/coverage-python.xml

  test-js:
    name: Run unit tests (javascript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run unit tests with coverage output
        run: npx jest # config specifies output to coverage/coverage-javascript.xml
